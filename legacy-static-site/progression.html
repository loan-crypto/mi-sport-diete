<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progression — Mon Sport &amp; Diète</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%236be675%22/><text x=%2250%22 y=%2270%22 font-family=%22Arial,sans-serif%22 font-weight=%22900%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22%23101116%22>M</text></svg>">
</head>
<body data-nav="progression" data-theme="sport">

<header class="site-header" id="site-header"></header>

<main class="container">
  <div class="page-header">
    <span class="kicker" data-i18n="progression.kicker">Discipline · Constance · Preuves</span>
    <h1 data-i18n="progression.title">Progression</h1>
    <p data-i18n="progression.subtitle">Tes photos de progression physique, dans l'ordre, avec le poids si tu veux le noter. Tout est stocké uniquement dans ce navigateur — pense à exporter depuis le Journal de temps en temps.</p>
  </div>

  <div class="card-box">
    <form id="progress-form">
      <div class="log-form" style="margin-bottom:0">
        <div class="field">
          <label for="progress-date" data-i18n="field.date">Date</label>
          <input type="date" id="progress-date" required>
        </div>
        <div class="field">
          <label for="progress-weight" data-i18n="field.weightOptional">Poids (kg, optionnel)</label>
          <input type="number" id="progress-weight" step="0.1" min="0" placeholder="ex: 78.5" data-i18n-placeholder="placeholder.progressWeight">
        </div>
        <div class="field grow">
          <label for="progress-note" data-i18n="field.noteOptional">Note (optionnel)</label>
          <input type="text" id="progress-note" placeholder="ressenti, contexte..." data-i18n-placeholder="placeholder.progressNote">
        </div>
      </div>
      <div class="field" style="margin-top:12px">
        <label for="progress-photo" data-i18n="field.photo">Photo</label>
        <input type="file" id="progress-photo" accept="image/*" required>
      </div>
      <button type="submit" style="margin-top:14px" data-i18n="btn.addToProgress">Ajouter à ma progression</button>
      <p id="progress-status" style="color:var(--text-muted);font-size:0.82rem;margin-top:8px"></p>
    </form>
  </div>

  <div id="progress-gallery" class="card-grid"></div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/helpers.js"></script>
<script src="js/layout.js"></script>
<script src="js/render-progression.js"></script>
<script src="js/chat-widget.js"></script>
</body>
</html>
